services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: market013-postgres-local
    environment:
      POSTGRES_DB: market013
      POSTGRES_USER: market013
      POSTGRES_PASSWORD: market013_dev_only
    ports:
      - "5432:5432"
    volumes:
      - market013-postgres-data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d/01-migrations:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  market013-postgres-data:
